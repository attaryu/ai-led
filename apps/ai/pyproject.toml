[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ami-assessment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-ollama>=0.1",
    "langchain-openai>=0.1",
    "pgvector>=0.3",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "httpx>=0.27",
    "supabase>=2.4",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "tabulate>=0.9",
    "ragas>=0.4",
    "langchain-openai>=0.1",
    "bullmq>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
