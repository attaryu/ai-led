services:
  postgres:
    # pgvector/pgvector:pg16 is upstream postgres:16 + the pgvector extension
    # precompiled — drop-in compatible, same data directory format. Used for
    # LED chunk embeddings (apps/ai/vectorstore/pgvector_store.py) alongside
    # every other table Prisma owns.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_led
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Local BuktiDukung storage until Cloudflare R2 lands (tracker: R2
      # Storage Module) — bukti-dukung.storage.ts is the one seam that swap
      # touches.
      - bukti_dukung_data:/repo/apps/backend/uploads/bukti-dukung
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_led?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  ai:
    build:
      context: ./apps/ai
      secrets:
        - hf_token
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/ai/data:/app/data
    env_file: apps/ai/.env
    environment:
      DATA_DIR: /app/data
      HF_HOME: /root/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /root/.cache/huggingface/sentence-transformers
      HF_HUB_DISABLE_XET: "1"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_led?schema=public
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:3000"
    environment:
      API_BASE_URL: http://backend:3000
    depends_on:
      - backend

secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  postgres_data:
  redis_data:
  bukti_dukung_data:
