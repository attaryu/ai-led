services:
  backend:
    build:
      context: ./backend
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app  # dev only: hot-reload; remove for production
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - HF_HOME=/root/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/root/.cache/huggingface/sentence-transformers
      - HF_HUB_DISABLE_XET=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
