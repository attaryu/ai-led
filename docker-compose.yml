services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app  # dev only: hot-reload; remove for production
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
